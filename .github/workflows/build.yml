name: Build APK

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      - name: 构建 APK
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中配置以下四项
          # 不配置也能构建，只是会使用一次性自签名密钥（无法覆盖安装已发布版本）
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x app/build.sh
          ./app/build.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DualAudio-apk
          path: app/out/DualAudio.apk
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/out/DualAudio.apk
          generate_release_notes: true
